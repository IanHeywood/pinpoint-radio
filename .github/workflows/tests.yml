name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PINPOINT_REQUIRE_ALL: "1"   # any skipped test fails the run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with every optional dependency)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fast,plots,test]" codex-africanus
      - name: Show versions
        run: python -c "import numpy, scipy, astropy, numba, casacore, africanus; print(numpy.__version__, scipy.__version__, astropy.__version__, numba.__version__, africanus.__version__)"
      - name: Run tests
        run: pytest -rs -s -v
