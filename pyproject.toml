[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pinpoint-radio"
version = "0.1.0"
description = "Fit bright sources in wsclean sub-band images to sub-pixel precision and DFT-predict them into a Measurement Set column."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5.3",
    "pyyaml>=6",
    "python-casacore>=3.5",
]

[project.optional-dependencies]
fast = ["numba>=0.58"]
plots = ["matplotlib>=3.6"]
test = ["pytest>=7"]
# Only used as an independent cross-check in the test-suite; never imported by the tool.
crosscheck = ["codex-africanus>=0.3"]

[project.scripts]
pinpoint = "pinpoint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
